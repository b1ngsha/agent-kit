minimum_pre_commit_version: "3.2.0"
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: file-token-limit
        name: staged files stay under 5000 tokens
        language: system
        entry: scripts/check-file-tokens.sh
        types: [text]
        exclude: (^|/)(uv\.lock)$

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --check .
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ruff
        name: ruff
        language: system
        entry: uv run ruff check .
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ty
        name: ty
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: django-check
        name: Django system checks
        language: system
        entry: uv run python manage.py check
        files: (^|/)(pyproject\.toml|config/|health/|tests/)
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest
        files: (^|/)(pyproject\.toml|config/|health/|tests/)
        pass_filenames: false
        require_serial: true
