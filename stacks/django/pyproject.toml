[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "A Django API service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<3.17",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<0.12",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["config", "health", "tests"]
